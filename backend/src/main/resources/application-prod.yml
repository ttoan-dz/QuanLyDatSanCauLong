# Production profile for Cloud deployment (Aiven MySQL on Render)
spring:
  datasource:
    # Trên production bắt buộc phải truyền DB_URL (hoặc SPRING_DATASOURCE_URL), không tự động fallback về localhost
    url: ${DB_URL:${SPRING_DATASOURCE_URL}}
    username: ${DB_USERNAME:${SPRING_DATASOURCE_USERNAME}}
    password: ${DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD}}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
      idle-timeout: 300000
      max-lifetime: 900000
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false

logging:
  level:
    root: WARN
    com.quanlydatsan: INFO
