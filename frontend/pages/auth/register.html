<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng Ký Tài Khoản — Quản Lý Đặt Sân Cầu Lông</title>
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh; background: #f1f5f9;">

  <div class="card" style="max-width: 480px; width: 100%; margin: 1.5rem; padding: 2rem; box-shadow: var(--shadow-lg);">
    <div style="text-align: center; margin-bottom: 1.5rem;">
      <span style="font-size: 2.5rem;">🏸</span>
      <h1 style="font-size: 1.5rem; font-weight: 700; color: var(--dark); margin-top: 0.5rem;">Đăng ký tài khoản</h1>
      <p style="color: var(--text-muted); font-size: 0.9rem;">Tạo tài khoản để bắt đầu đặt sân</p>
    </div>

    <div id="alert-container"></div>

    <form onsubmit="handleRegister(event)">
      <div class="form-group">
        <label for="input-hoTen">Họ và tên (*)</label>
        <input type="text" id="input-hoTen" class="form-control" placeholder="Nguyễn Văn A" required autofocus>
      </div>

      <div class="form-group">
        <label for="input-sdt">Số điện thoại (*)</label>
        <input type="tel" id="input-sdt" class="form-control" placeholder="0912345678" pattern="[0-9]{10,11}" required>
      </div>

      <div class="form-group">
        <label for="input-email">Email (tuỳ chọn)</label>
        <input type="email" id="input-email" class="form-control" placeholder="email@example.com">
      </div>

      <div class="form-group">
        <label for="input-tenDangNhap">Tên đăng nhập (*)</label>
        <input type="text" id="input-tenDangNhap" class="form-control" minlength="4" maxlength="50" placeholder="Ít nhất 4 ký tự" required>
      </div>

      <div class="form-group">
        <label for="input-matKhau">Mật khẩu (*)</label>
        <input type="password" id="input-matKhau" class="form-control" minlength="6" placeholder="Ít nhất 6 ký tự" required>
      </div>

      <button type="submit" id="btn-register" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Đăng ký</button>
    </form>

    <div style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: var(--text-muted);">
      Đã có tài khoản? <a href="/pages/auth/login.html" style="color: var(--primary-dark); font-weight: 600; text-decoration: none;">Đăng nhập ngay</a>
      <div style="margin-top: 0.5rem;">
        <a href="/index.html" style="color: var(--secondary); text-decoration: none; font-size: 0.85rem;">← Về trang chủ</a>
      </div>
    </div>
  </div>

  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/utils.js"></script>
  <script src="/assets/js/auth.js"></script>
</body>
</html>
