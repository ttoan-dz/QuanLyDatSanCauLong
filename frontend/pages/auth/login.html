<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng Nhập — Quản Lý Đặt Sân Cầu Lông</title>
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh; background: #f1f5f9;">

  <div class="card" style="max-width: 420px; width: 100%; margin: 1.5rem; padding: 2rem; box-shadow: var(--shadow-lg);">
    <div style="text-align: center; margin-bottom: 1.5rem;">
      <span style="font-size: 2.5rem;">🏸</span>
      <h1 style="font-size: 1.5rem; font-weight: 700; color: var(--dark); margin-top: 0.5rem;">Đăng nhập hệ thống</h1>
      <p style="color: var(--text-muted); font-size: 0.9rem;">Đặt sân & Quản lý sân cầu lông</p>
    </div>

    <div id="alert-container"></div>

    <form onsubmit="handleLogin(event)">
      <div class="form-group">
        <label for="input-tenDangNhap">Tên đăng nhập</label>
        <input type="text" id="input-tenDangNhap" class="form-control" placeholder="VD: an.nguyen hoặc admin" required autofocus>
      </div>

      <div class="form-group">
        <label for="input-matKhau">Mật khẩu</label>
        <input type="password" id="input-matKhau" class="form-control" placeholder="••••••••" required>
      </div>

      <button type="submit" id="btn-login" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Đăng nhập</button>
    </form>

    <div style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: var(--text-muted);">
      Chưa có tài khoản? <a href="/pages/auth/register.html" style="color: var(--primary-dark); font-weight: 600; text-decoration: none;">Đăng ký ngay</a>
      <div style="margin-top: 0.5rem;">
        <a href="/index.html" style="color: var(--secondary); text-decoration: none; font-size: 0.85rem;">← Về trang chủ</a>
      </div>
    </div>

    <div style="margin-top: 1.5rem; padding-top: 1rem; border-top: 1px dashed var(--border); font-size: 0.8rem; color: var(--text-muted);">
      <strong>Tài khoản mẫu:</strong><br>
      • Admin: <code>admin</code> / <code>123456</code><br>
      • Khách hàng: <code>an.nguyen</code> / <code>123456</code>
    </div>
  </div>

  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/utils.js"></script>
  <script src="/assets/js/auth.js"></script>
</body>
</html>
